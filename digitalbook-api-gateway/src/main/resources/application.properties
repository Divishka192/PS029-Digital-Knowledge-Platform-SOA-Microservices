spring.application.name=digitalbook-api-gateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# JWT
jwt.secret=digitalbook-super-secret-key-2026-digitalbook-security-key

# Auth Service
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://DIGITALBOOK-AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

# Content Service
spring.cloud.gateway.server.webflux.routes[1].id=content-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://DIGITALBOOK-CONTENT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/content/**

# Access Service
spring.cloud.gateway.server.webflux.routes[2].id=access-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://DIGITALBOOK-ACCESS-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/access/**

# Usage Service
spring.cloud.gateway.server.webflux.routes[3].id=usage-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://DIGITALBOOK-USAGE-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/usage/**